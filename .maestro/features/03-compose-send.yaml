# Compose a new message and send it to userb; userb's mailbox (checked over
# JMAP) must get it.
appId: org.bulwarkmail.mobile
name: Compose and send
tags:
  - features
---
- runFlow: ../subflows/signed-in.yaml
- evalScript: ${output.subject = 'E2E compose ' + DEVICE + '-' + APPEARANCE + '-' + ORIENTATION + ' ' + Date.now()}
- tapOn: "Compose"
- extendedWaitUntil:
    visible: "New Message"
    timeout: 15000
- tapOn: "Recipient email addresses"
- inputText: "userb@example.org"
- pressKey: Enter
- tapOn:
    text: "Subject"
    index: 1
- inputText: ${output.subject}
- runFlow:
    file: ../subflows/compose-body.yaml
    env:
      FROM_SUBJECT: "yes"
      BODY: "Hello from the iOS simulator test."
- takeScreenshot: compose-01-filled

# The attach sheet offers its options one by one (it used to be a single
# accessibility element, and picking one opened no picker on iOS).
- tapOn: "Attach"
- extendedWaitUntil:
    visible: "Photos & Videos"
    timeout: 10000
- assertVisible: "Camera"
# A server with Files offers "Upload from this device" and "Attach from
# Files" instead of a plain "Files".
- assertVisible: "Upload from this device|Files"
- takeScreenshot: compose-02-attach-sheet
- evalScript: ${output.pickPhoto = ORIENTATION != 'landscape'}
# Pick a photo in the system picker (subflows/pick-photo.yaml). The iPad in
# landscape lays the picker out differently, so there the flow only closes
# the sheet.
- runFlow:
    when:
      true: ${!output.pickPhoto}
    commands:
      - tapOn: "Cancel"
- runFlow:
    when:
      true: ${output.pickPhoto}
    commands:
      - tapOn: "Photos & Videos"
      - runFlow: ../subflows/pick-photo.yaml
- extendedWaitUntil:
    visible: "New Message"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
# The picker can also close without a photo (seen on the iPad): pick again
# from the attach sheet. The photo must be on the message before it goes out.
- runFlow:
    when:
      true: ${output.pickPhoto}
    commands:
      - runFlow:
          when:
            notVisible: "icon.png"
          commands:
            - tapOn: "Attach"
            - extendedWaitUntil:
                visible: "Photos & Videos"
                timeout: 10000
            - tapOn: "Photos & Videos"
            - runFlow: ../subflows/pick-photo.yaml
            - extendedWaitUntil:
                visible: "New Message"
                timeout: 20000
            - waitForAnimationToEnd:
                timeout: 5000
      - assertVisible: "icon.png"
- takeScreenshot: compose-04-with-photo

- tapOn: "Send"
- extendedWaitUntil:
    visible: "Email sent successfully"
    timeout: 20000
    optional: true
- runFlow:
    file: ../subflows/assert-delivered.yaml
    env:
      SUBJECT: ${output.subject}
- runFlow:
    when:
      true: ${output.pickPhoto}
    commands:
      - assertTrue:
          condition: ${output.helper.attachments.length >= 1}
          label: "${output.subject} carries the picked photo"
