# Compose a new message and send it to userb; userb's mailbox (checked over
# JMAP) must get it.
appId: org.bulwarkmail.mobile
name: Compose and send
tags:
  - features
---
- runFlow: ../subflows/signed-in.yaml
- evalScript: ${output.subject = 'E2E compose ' + DEVICE + '-' + APPEARANCE + '-' + ORIENTATION + ' ' + Date.now()}
- tapOn: "Compose"
- extendedWaitUntil:
    visible: "New Message"
    timeout: 15000
- tapOn: "Recipient email addresses"
- inputText: "userb@example.org"
- pressKey: Enter
- tapOn:
    text: "Subject"
    index: 1
- inputText: ${output.subject}
- runFlow:
    file: ../subflows/compose-body.yaml
    env:
      BODY: "Hello from the iOS simulator test."
- takeScreenshot: compose-01-filled

# The attach sheet offers its options one by one (it used to be a single
# accessibility element). The system photo and file pickers run in another
# process that XCTest can't drive, so a picked attachment is covered by the
# forward in 04-incoming-reply-forward instead.
- tapOn: "Attach"
- extendedWaitUntil:
    visible: "Photos & Videos"
    timeout: 10000
- assertVisible: "Camera"
- assertVisible: "Files"
- takeScreenshot: compose-02-attach-sheet
- tapOn: "Photos & Videos"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: compose-03-photo-picker
# Dismiss the picker sheet.
- swipe:
    start: 50%,12%
    end: 50%,95%
    duration: 400
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      notVisible: "New Message"
    commands:
      - swipe:
          start: 50%,12%
          end: 50%,95%
          duration: 400
- extendedWaitUntil:
    visible: "New Message"
    timeout: 10000

- tapOn: "Send"
- extendedWaitUntil:
    visible: "Email sent successfully"
    timeout: 20000
    optional: true
- runFlow:
    file: ../subflows/assert-delivered.yaml
    env:
      SUBJECT: ${output.subject}
