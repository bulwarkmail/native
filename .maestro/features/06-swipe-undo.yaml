# Swipe actions with undo: swipe left archives (undo brings it back), swipe
# right toggles read.
appId: org.bulwarkmail.mobile
name: Swipe actions and undo
tags:
  - features
---
- runFlow: ../subflows/signed-in.yaml
- scrollUntilVisible:
    element: ".*Grüße aus München.*"
    direction: DOWN
    timeout: 20000
- swipe:
    from: ".*Grüße aus München.*"
    direction: LEFT
    duration: 400
- extendedWaitUntil:
    visible: "Email archived"
    timeout: 10000
- takeScreenshot: swipe-01-archived
- assertNotVisible: ".*Grüße aus München.*"
- tapOn: "UNDO"
- extendedWaitUntil:
    visible: ".*Grüße aus München.*"
    timeout: 15000
- takeScreenshot: swipe-02-undone

- swipe:
    from: ".*Grüße aus München.*"
    direction: RIGHT
    duration: 400
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: swipe-03-read-toggled
- swipe:
    from: ".*Grüße aus München.*"
    direction: RIGHT
    duration: 400
- waitForAnimationToEnd:
    timeout: 3000
