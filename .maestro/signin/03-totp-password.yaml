# A TOTP account signs in with a password: Stalwart answers 402 for the right
# password, and the app asks for the code.
appId: org.bulwarkmail.mobile
name: Password with TOTP
tags:
  - signin
---
- runFlow: ../subflows/start.yaml
- runFlow:
    file: ../subflows/manual-server.yaml
    env:
      HOST: ${SERVER}
- tapOn: "Sign in with a password instead"
- runFlow:
    file: ../subflows/password-form.yaml
    env:
      LOGIN: ${TOTP_ACCOUNT}@example.org
- extendedWaitUntil:
    visible: "Authentication code"
    timeout: 30000
- takeScreenshot: totp-01-code-asked
- runFlow: ../subflows/two-factor.yaml
- runFlow: ../subflows/inbox.yaml
- takeScreenshot: totp-02-inbox
