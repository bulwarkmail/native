# A wrong password and an unreachable server: the app says what went wrong
# and stays on the form.
appId: org.bulwarkmail.mobile
name: Password errors
tags:
  - signin
---
- runFlow: ../subflows/start.yaml
- runFlow:
    file: ../subflows/manual-server.yaml
    env:
      HOST: ${SERVER}
- tapOn: "Sign in with a password instead"
- runFlow:
    file: ../subflows/password-form.yaml
    env:
      LOGIN: ${ACCOUNT}@example.org
      PASSWORD: wrong-password-123
- extendedWaitUntil:
    visible: "That didn't work"
    timeout: 30000
- takeScreenshot: errors-01-wrong-password
- assertVisible:
    id: login-password-input

# Back to the server step, then a host that doesn't resolve.
- tapOn: "Back"
- tapOn: "Back"
- runFlow:
    file: ../subflows/type.yaml
    env:
      FIELD: login-server-input
      TEXT: mail.does-not-exist.invalid
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Sign in with a password instead"
    timeout: 20000
- tapOn: "Sign in with a password instead"
- runFlow:
    file: ../subflows/password-form.yaml
    env:
      LOGIN: ${ACCOUNT}@example.org
- extendedWaitUntil:
    visible: "Can't reach mail.does-not-exist.invalid|No mail server at mail.does-not-exist.invalid|Sign-in failed"
    timeout: 60000
- takeScreenshot: errors-02-unreachable
- assertVisible:
    id: login-password-input
