# Second account by password via "Another account on <host>", then switch
# between the two.
appId: org.bulwarkmail.mobile
name: Add account, password
tags:
  - signin
---
- runFlow: ../subflows/start.yaml
- runFlow:
    file: ../subflows/password-sign-in.yaml
    env:
      LOGIN: ${ACCOUNT}@example.org
- runFlow: ../subflows/open-add-account.yaml
- takeScreenshot: add-password-01-choices
- tapOn: "Another account on .*"
- extendedWaitUntil:
    visible: "Sign in with a password instead"
    timeout: 20000
- tapOn: "Sign in with a password instead"
- runFlow:
    file: ../subflows/password-form.yaml
    env:
      LOGIN: ${ACCOUNT2}@example.org
- runFlow: ../subflows/inbox.yaml
- runFlow:
    file: ../subflows/check-active-account.yaml
    env:
      ACTIVE: ${ACCOUNT2}@example.org
- assertVisible: ${ACCOUNT}@example.org
- takeScreenshot: add-password-02-two-accounts
