# Password sign-in as the first account, sign out, sign in again.
appId: org.bulwarkmail.mobile
name: Password, sign out, sign in again
tags:
  - signin
---
- runFlow: ../subflows/start.yaml
- takeScreenshot: password-01-choices
- runFlow:
    file: ../subflows/manual-server.yaml
    env:
      HOST: ${SERVER}
- takeScreenshot: password-02-confirm
- tapOn: "Sign in with a password instead"
- runFlow:
    file: ../subflows/password-form.yaml
    env:
      LOGIN: ${ACCOUNT}@example.org
- runFlow: ../subflows/inbox.yaml
- takeScreenshot: password-03-inbox

- runFlow: ../subflows/sign-out.yaml
- extendedWaitUntil:
    visible: "Enter server details manually"
    timeout: 30000
- takeScreenshot: password-04-signed-out

- runFlow:
    file: ../subflows/password-sign-in.yaml
    env:
      LOGIN: ${ACCOUNT}@example.org
- takeScreenshot: password-05-signed-in-again
