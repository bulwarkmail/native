# Push on iOS: the relay's payload carries only ids and a placeholder text.
# A tap opens the message, with the app running and from a cold start. The
# helper sends the message as userb and pushes the relay's payload with
# simctl, so this needs no APNs key.
#
# simctl push hands the payload to the simulator as a local notification
# request: the notification service extension (plugins/ios-push), which
# puts sender and subject in, never runs that way (the log shows no
# NotificationService process). So the banner shows the placeholder here;
# the extension needs a real APNs push to be tested.
appId: org.bulwarkmail.mobile
name: Push notification on iOS
tags:
  - push
---
- runFlow: ../subflows/signed-in.yaml
# Without notification permission iOS drops the push silently, and the
# launch-time grant doesn't reach it on these simulators: let the app ask
# (the Calendar tab does, for event reminders) and allow.
- tapOn:
    id: tab-calendar
- extendedWaitUntil:
    visible: ".*Would Like to Send You Notifications.*|Go to today"
    timeout: 30000
- runFlow:
    when:
      visible: ".*Would Like to Send You Notifications.*"
    commands:
      - tapOn:
          text: "Allow"
          optional: true
- tapOn:
    id: tab-mail
- waitForAnimationToEnd:
    timeout: 3000
- pressKey: Home

# 1. The banner shows (and what it says).
- evalScript: ${output.subject0 = 'E2E push banner ' + Date.now()}
- runScript:
    file: ../scripts/helper.js
    env:
      CALL: /simpush?to=${ACCOUNT}&subject=${encodeURIComponent(output.subject0)}
- extendedWaitUntil:
    visible: ".*${output.subject0}.*|.*New message.*"
    timeout: 30000
- takeScreenshot: push-01-banner

# 2. A tap opens the message, app in the background. The banner shows for a
# few seconds and finding it takes Maestro about as long; taps on the lock
# screen list do nothing on these simulators. So tap where the banner
# appears, right after the push.
- evalScript: ${output.subject = 'E2E push ' + Date.now()}
- runScript:
    file: ../scripts/helper.js
    env:
      CALL: /simpush?to=${ACCOUNT}&subject=${encodeURIComponent(output.subject)}
- runFlow: ../subflows/tap-banner.yaml
- extendedWaitUntil:
    visible: "Reply All"
    timeout: 60000
- assertVisible: ".*${output.subject}.*"
- takeScreenshot: push-02-opened-warm

# 3. The same from a cold start: the app isn't running.
- stopApp
- evalScript: ${output.subject2 = 'E2E push cold ' + Date.now()}
- runScript:
    file: ../scripts/helper.js
    env:
      CALL: /simpush?to=${ACCOUNT}&subject=${encodeURIComponent(output.subject2)}
- runFlow: ../subflows/tap-banner.yaml
- extendedWaitUntil:
    visible: "Reply All"
    timeout: 90000
- assertVisible: ".*${output.subject2}.*"
- takeScreenshot: push-04-opened-cold
