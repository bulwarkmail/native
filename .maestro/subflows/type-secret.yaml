# Type a secret into the field with id FIELD. Same focus handling as
# type.yaml, but the value can't be checked (a secure field shows dots), and
# it must never be shown, so a lost keystroke surfaces as a failed sign-in.
appId: org.bulwarkmail.mobile
---
- runFlow:
    when:
      notVisible:
        id: ${FIELD}
        focused: true
    commands:
      - tapOn:
          id: ${FIELD}
- waitForAnimationToEnd:
    timeout: 3000
- eraseText: 80
- inputText: ${TEXT}
