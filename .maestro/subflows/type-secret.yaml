# Type a secret into the field with id FIELD (TAP=no for a field that focuses
# itself, see type.yaml). The value can't be checked (a secure field shows
# dots) and must never be shown, so a lost keystroke surfaces as a failed
# sign-in.
appId: org.bulwarkmail.mobile
---
- runFlow:
    when:
      true: ${TAP != 'no'}
    commands:
      - tapOn:
          id: ${FIELD}
- waitForAnimationToEnd:
    timeout: 3000
- inputText: ${TEXT}
