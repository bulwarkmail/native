# Type a secret into the field with id FIELD (TAP=no for a field that focuses
# itself; see type.yaml for why the first character goes alone). The value
# can't be checked (a secure field shows dots) and must never be shown, so a
# lost keystroke surfaces as a failed sign-in.
appId: org.bulwarkmail.mobile
---
- evalScript: ${output.secretHead = TEXT.slice(0, 1); output.secretTail = TEXT.slice(1)}
- runFlow:
    when:
      true: ${TAP != 'no'}
    commands:
      - tapOn:
          id: ${FIELD}
- waitForAnimationToEnd:
    timeout: 3000
- inputText: ${output.secretHead}
# A short pause: wait for something that never shows.
- extendedWaitUntil:
    visible: "zz-no-such-element-zz"
    timeout: 1000
    optional: true
- inputText: ${output.secretTail}
