# Tap the notification matching TEXT in Notification Center. The banner
# goes away after a few seconds, often between Maestro finding it and
# tapping it (the tap then lands on whatever is below): wait until it is
# gone, pull Notification Center down from the top left, and tap there.
# A tap while the pull-down still moves does nothing, so tap until the
# notification is gone (the app opened).
appId: org.bulwarkmail.mobile
---
- extendedWaitUntil:
    notVisible: ${TEXT}
    timeout: 15000
    optional: true
- swipe:
    start: 20%,1%
    end: 20%,60%
    duration: 500
- extendedWaitUntil:
    visible: ${TEXT}
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- repeat:
    while:
      visible: ${TEXT}
    times: 3
    commands:
      - tapOn: ${TEXT}
      - waitForAnimationToEnd:
          timeout: 4000
