# iOS shows a one-time slide-to-type tip over the keyboard on a fresh
# simulator. The workflow turns it off, but dismiss it if it still shows up.
appId: org.bulwarkmail.mobile
---
- runFlow:
    when:
      visible: "Speed up your typing by sliding.*"
    commands:
      # The sign-in screen has its own Continue button; take the tip's.
      - tapOn:
          text: "Continue"
          below: "Speed up your typing by sliding.*"
