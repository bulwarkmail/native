# Stalwart's own sign-in page inside the auth session. env LOGIN, TOTP (any
# non-empty value: the account needs a one-time code).
appId: org.bulwarkmail.mobile
---
- extendedWaitUntil:
    visible: "you@example.com"
    timeout: 60000
- takeScreenshot: stalwart-login-page
- runFlow:
    file: type-web.yaml
    env:
      HINT: "you@example.com"
      TEXT: ${LOGIN}
- tapOn: "••••••••"
- inputText: ${PASSWORD}
- runFlow:
    when:
      true: ${TOTP == 'yes'}
    commands:
      - runScript:
          file: ../scripts/helper.js
          env:
            CALL: /totp
      - tapOn: "000000"
      - inputText: ${output.helper.code}
- tapOn:
    text: "Sign in"
    index: 1
# Stalwart 1.0.1 asks for consent after Sign in, once per client grant;
# 0.16 and repeat sign-ins go straight back to the app.
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible: "Allow"
    commands:
      - takeScreenshot: stalwart-consent-page
      - tapOn: "Allow"
