# On the password step: fill in LOGIN and PASSWORD and sign in.
appId: org.bulwarkmail.mobile
---
- extendedWaitUntil:
    visible:
      id: login-username-input
    timeout: 20000
- runFlow:
    file: type.yaml
    env:
      FIELD: login-username-input
      TEXT: ${LOGIN}
- runFlow:
    file: type-secret.yaml
    env:
      FIELD: login-password-input
      TEXT: ${PASSWORD}
# Return on the password field signs in.
- pressKey: Enter
