# The app asks for notification permission now and then (calendar
# reminders, push). The system alert covers the whole app, so XCTest sees
# nothing else until it is answered: allow it when it is up. Taps on system
# alerts miss in landscape, so answer it in portrait.
appId: org.bulwarkmail.mobile
---
- runFlow:
    when:
      visible: ".*Would Like to Send You Notifications.*"
    commands:
      - setOrientation: PORTRAIT
      - waitForAnimationToEnd:
          timeout: 3000
      # Maestro repeats a tap that seems to change nothing; here the repeat
      # landed on the app once the alert was gone (a day in the calendar's
      # month grid, which opened that day). Tap once.
      - tapOn:
          text: "Allow"
          optional: true
          retryTapIfNoChange: false
      - runFlow:
          when:
            true: ${ORIENTATION == 'landscape'}
          commands:
            - setOrientation: LANDSCAPE_LEFT
