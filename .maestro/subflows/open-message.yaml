# From a message list: open the message whose row mentions SUBJECT.
appId: org.bulwarkmail.mobile
---
- scrollUntilVisible:
    element: ".*${SUBJECT}.*"
    direction: DOWN
    timeout: 30000
- tapOn: ".*${SUBJECT}.*"
# The message toolbar's "more" button: "Reply All" shows on the phone, but
# the iPad pane has a quick reply box instead for mail to one recipient.
- extendedWaitUntil:
    visible: "more"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
