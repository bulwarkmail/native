# A sign-in link from another app asks first. Continue.
appId: org.bulwarkmail.mobile
---
# simctl openurl acts like a link from another app: iOS asks first.
- extendedWaitUntil:
    visible: "Open in .*Bulwark Mobile.*|Sign in with a link.|Open the sign-in page of.*"
    timeout: ${LINK_WAIT || 60000}
- runFlow:
    when:
      visible: "Open in .*Bulwark Mobile.*"
    commands:
      - tapOn: "Open"
# Right after a sign-out the app can take a while to get to the link: on
# the iPad, 61 to 67 s passed between Open and this dialog in two runs (the
# first link flow of the leg, 08), so 60 s was just too short.
- extendedWaitUntil:
    visible: "Sign in with a link.|Open the sign-in page of.*"
    timeout: 90000
- takeScreenshot: link-confirm-prompt
- tapOn:
    text: "Continue"
    below: "Sign in with a link."
# A tap while the alert is still animating in can go nowhere: tap again if
# it is still up.
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible: "Sign in with a link."
    commands:
      - tapOn:
          text: "Continue"
          below: "Sign in with a link."
