# In the composer: type BODY into the editor. The rich editor is a WebView
# whose placeholder is CSS, so it may not be exposed; then tap the middle of
# the screen, which is the body area below Subject (above the keyboard).
# FROM_SUBJECT=yes: the Subject field has the focus; Return there moves it
# to the body (an iPad in landscape shows hardly any body with the keyboard
# up, so there is nothing to tap).
appId: org.bulwarkmail.mobile
---
- runFlow:
    when:
      true: ${FROM_SUBJECT == 'yes'}
    commands:
      - pressKey: Enter
      - waitForAnimationToEnd:
          timeout: 2000
      - inputText: ${BODY}
- runFlow:
    when:
      true: ${FROM_SUBJECT != 'yes'}
    commands:
      - runFlow:
          when:
            visible: "Write your message.*"
          commands:
            - tapOn: "Write your message.*"
      # A tap on the WebView doesn't always take the focus from the Subject field
      # (on the iPad the body once went into Subject); a second tap does.
      # (hideKeyboard fails here: the composer's keyboard has no dismiss key.)
      - runFlow:
          when:
            notVisible: "Write your message.*"
          commands:
            - tapOn:
                point: "50%,50%"
            - waitForAnimationToEnd:
                timeout: 2000
            - tapOn:
                point: "50%,50%"
      - waitForAnimationToEnd:
          timeout: 3000
      - inputText: ${BODY}
