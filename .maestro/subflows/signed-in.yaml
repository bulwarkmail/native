# Feature flows start here: the app signed in to ACCOUNT, on the inbox.
# Keeps the app's data between flows; signs in only when needed.
appId: org.bulwarkmail.mobile
---
- launchApp:
    permissions:
      notifications: allow
      photos: allow
      camera: allow
# Answer the notification prompt (if the app asks) before turning to
# landscape: rotated, taps on system alerts miss.
- setOrientation: PORTRAIT
- extendedWaitUntil:
    visible: "Enter server details manually|Inbox|.*Would Like to Send You Notifications.*"
    timeout: 120000
- runFlow: allow-notifications.yaml
- runFlow:
    when:
      true: ${ORIENTATION == 'landscape'}
    commands:
      - setOrientation: LANDSCAPE_LEFT
- extendedWaitUntil:
    visible: "Enter server details manually|Inbox"
    timeout: 30000
- runFlow:
    when:
      visible: "Enter server details manually"
    commands:
      - runFlow:
          file: password-sign-in.yaml
          env:
            LOGIN: ${ACCOUNT}@example.org
- runFlow: allow-notifications.yaml
- tapOn:
    id: tab-mail
- runFlow: go-to-inbox.yaml
# The "Get notified about new mail" card comes 1.5 s after each start until
# it is answered, and floats over the compose button and the bottom of every
# page. The sign-in answers it (inbox.yaml), but a sign-in cut short (a
# driver that died, a retried flow) leaves it to every later flow.
- extendedWaitUntil:
    visible: "Not now"
    timeout: 3000
    optional: true
- runFlow:
    when:
      visible: "Not now"
    commands:
      - tapOn: "Not now"
