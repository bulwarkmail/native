# The Settings account card names the active account ACTIVE, and the Account
# page lists another account to switch to. Goes back to Mail afterwards.
appId: org.bulwarkmail.mobile
---
- tapOn:
    id: tab-settings
- extendedWaitUntil:
    visible: ".*${ACTIVE}.*"
    timeout: 20000
- tapOn: ".*${ACTIVE}.*"
- scrollUntilVisible:
    element: "Switch to this account"
    direction: DOWN
    timeout: 20000
- takeScreenshot: accounts-${ACTIVE}
- tapOn:
    id: tab-mail
