# Settings list: find the row ROW (regex on "Title, summary"), open it,
# check PROOF shows, screenshot, and go back on a phone.
#
# A row can count as visible while it is under the phone's tab bar or half
# off the iPad's screen, and the tap then misses. The phone scrolls it to the
# middle. The iPad's list is a left column that Maestro's scroll (always in
# the middle of the screen) doesn't reach, so it searches for the page (Q,
# a word of its title) instead, which puts the row near the top.
appId: org.bulwarkmail.mobile
---
- runFlow:
    when:
      true: ${DEVICE == 'tablet' && !!Q}
    commands:
      - repeat:
          while:
            notVisible: ${ROW}
          times: 2
          commands:
            - tapOn: "Search settings"
            - eraseText: 40
            - inputText: ${Q}
            - waitForAnimationToEnd:
                timeout: 3000
- runFlow:
    when:
      true: ${DEVICE != 'tablet'}
    commands:
      - scrollUntilVisible:
          element: ${ROW}
          direction: DOWN
          centerElement: true
          visibilityPercentage: 100
          timeout: 30000
# A tap while the list still coasts from the swipe only stops it.
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: ${ROW}
- waitForAnimationToEnd:
    timeout: 5000
# On the phone the page replaces the list: make sure it opened before
# scrolling (else the swipes below scroll the list away).
- runFlow:
    when:
      true: ${DEVICE != 'tablet'}
    commands:
      - runFlow:
          when:
            notVisible: "Back"
          commands:
            - tapOn: ${ROW}
      - extendedWaitUntil:
          visible: "Back"
          timeout: 10000
# PROOF can be further down the page: scroll the page (the right-hand pane
# on the iPad) until it shows.
- runFlow:
    when:
      true: ${DEVICE == 'tablet'}
    commands:
      - repeat:
          while:
            notVisible: ${PROOF}
          times: 6
          commands:
            - swipe:
                start: 75%,80%
                end: 75%,40%
                duration: 600
- runFlow:
    when:
      true: ${DEVICE != 'tablet'}
    commands:
      - repeat:
          while:
            notVisible: ${PROOF}
          times: 6
          commands:
            - swipe:
                start: 50%,80%
                end: 50%,40%
                duration: 600
- extendedWaitUntil:
    visible: ${PROOF}
    timeout: 20000
- takeScreenshot: settings-${NAME}
- runFlow:
    when:
      visible: "Back"
    commands:
      - tapOn: "Back"
