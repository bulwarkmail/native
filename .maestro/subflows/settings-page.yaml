# Settings list: scroll to the row ROW (regex on "Title, summary"), open it,
# check PROOF shows, screenshot, and go back on a phone. On the iPad the list
# is a left column, so scroll there instead of the middle of the screen.
# (Swipe coordinates have to be literals.)
appId: org.bulwarkmail.mobile
---
- runFlow:
    when:
      true: ${DEVICE == 'tablet'}
    commands:
      - repeat:
          while:
            notVisible: ${ROW}
          times: 10
          commands:
            - swipe:
                start: 18%,80%
                end: 18%,40%
                duration: 600
- runFlow:
    when:
      true: ${DEVICE != 'tablet'}
    commands:
      - repeat:
          while:
            notVisible: ${ROW}
          times: 10
          commands:
            - swipe:
                start: 50%,80%
                end: 50%,40%
                duration: 600
- tapOn: ${ROW}
- waitForAnimationToEnd:
    timeout: 5000
# PROOF can be further down the page: scroll the page (the right-hand pane
# on the iPad) until it shows.
- runFlow:
    when:
      true: ${DEVICE == 'tablet'}
    commands:
      - repeat:
          while:
            notVisible: ${PROOF}
          times: 6
          commands:
            - swipe:
                start: 75%,80%
                end: 75%,40%
                duration: 600
- runFlow:
    when:
      true: ${DEVICE != 'tablet'}
    commands:
      - repeat:
          while:
            notVisible: ${PROOF}
          times: 6
          commands:
            - swipe:
                start: 50%,80%
                end: 50%,40%
                duration: 600
- extendedWaitUntil:
    visible: ${PROOF}
    timeout: 20000
- takeScreenshot: settings-${NAME}
- runFlow:
    when:
      visible: "Back"
    commands:
      - tapOn: "Back"
