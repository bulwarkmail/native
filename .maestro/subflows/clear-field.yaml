# Empty the field with id FIELD. A tap puts the cursor where it lands and
# eraseText only deletes before the cursor, so erase in passes: each tap
# lands in the middle of what is left.
appId: org.bulwarkmail.mobile
---
- repeat:
    times: 4
    commands:
      - tapOn:
          id: ${FIELD}
      - eraseText: 100
