# Type TEXT into a web page field found by its placeholder HINT (the sign-in
# pages in the auth session), and check it arrived as typed. Now and then a
# stray character lands in front of it on the CI simulator; then erase the
# field and type again. The caret is still at the end of what was just
# typed, so eraseText (which deletes before the caret) empties it; selecting
# the text with a long press didn't work and appended instead. SECRET=yes
# skips the check (a password field shows dots). TAP=no types into the
# field that has the focus already.
appId: org.bulwarkmail.mobile
---
- runFlow:
    when:
      true: ${TAP != 'no'}
    commands:
      - tapOn: ${HINT}
- waitForAnimationToEnd:
    timeout: 3000
- inputText: ${TEXT}
- runFlow:
    when:
      true: ${SECRET != 'yes'}
    commands:
      - repeat:
          while:
            notVisible: ${TEXT}
          times: 2
          commands:
            - eraseText: 150
            - waitForAnimationToEnd:
                timeout: 2000
            - inputText: ${TEXT}
      - assertVisible: ${TEXT}
