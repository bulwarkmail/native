# The Bulwark webmail's sign-in page inside the auth session (the app's
# "Sign in via webmail" hand-off). env LOGIN, TOTP=yes for a TOTP account.
appId: org.bulwarkmail.mobile
---
- extendedWaitUntil:
    visible: "user@example.com"
    timeout: 60000
- takeScreenshot: webmail-login-page
- runFlow:
    file: type-web.yaml
    env:
      HINT: "user@example.com"
      TEXT: ${LOGIN}
- runFlow:
    file: type-web.yaml
    env:
      HINT: "Enter your password"
      TEXT: ${PASSWORD}
      SECRET: "yes"
- tapOn: "Sign in"
- runFlow:
    when:
      true: ${TOTP == 'yes'}
    commands:
      - extendedWaitUntil:
          visible: "000000"
          timeout: 30000
      - runScript:
          file: ../scripts/helper.js
          env:
            CALL: /totp
      - tapOn: "000000"
      - inputText: ${output.helper.code}
      - tapOn: "Sign in|Verify"

# Before handing over, the webmail asks whether the app may take the sign-in.
- extendedWaitUntil:
    visible: "Hand over to the app"
    timeout: 60000
- takeScreenshot: webmail-handover-prompt
- tapOn: "Hand over to the app"
