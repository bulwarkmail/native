# iOS asks before an app opens a sign-in session in the system browser:
# "“Bulwark Mobile” Wants to Use “<domain>” to Sign In". Accept it.
appId: org.bulwarkmail.mobile
---
- extendedWaitUntil:
    visible: ".*Wants to Use.*to Sign In.*"
    timeout: 30000
- takeScreenshot: auth-session-alert
- tapOn:
    text: "Continue"
    below: ".*Wants to Use.*to Sign In.*"
