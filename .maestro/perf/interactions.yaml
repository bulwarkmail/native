# Performance runs: the interactions the harness times (scripts/e2e/perf.mjs).
# The app is already running with -perfMarks YES; no launchApp here, it would
# start it without the launch argument.
appId: org.bulwarkmail.mobile
name: Perf interactions
---
- extendedWaitUntil:
    visible:
      id: email-row
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 5000

# Open a message and go back, five times.
- repeat:
    times: 5
    commands:
      - tapOn:
          id: email-row
          index: 1
      - extendedWaitUntil:
          visible: "Reply All"
          timeout: 20000
      - waitForAnimationToEnd:
          timeout: 3000
      - runFlow:
          when:
            visible: "Back"
          commands:
            - tapOn: "Back"
      - waitForAnimationToEnd:
          timeout: 3000

# Switch through the tabs, three times.
- repeat:
    times: 3
    commands:
      - tapOn:
          id: tab-calendar
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          id: tab-contacts
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          id: tab-files
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          id: tab-settings
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          id: tab-mail
      - waitForAnimationToEnd:
          timeout: 3000

# Open the composer and close it untouched, five times.
- repeat:
    times: 5
    commands:
      - tapOn: "Compose"
      - extendedWaitUntil:
          visible: "New Message"
          timeout: 20000
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn: "Close"
      - waitForAnimationToEnd:
          timeout: 3000
      - runFlow:
          when:
            visible: "Discard"
          commands:
            - tapOn: "Discard"

# Fling through the long list, then back up.
- repeat:
    times: 8
    commands:
      - swipe:
          start: 50%,80%
          end: 50%,20%
          duration: 250
      - waitForAnimationToEnd:
          timeout: 4000
- repeat:
    times: 8
    commands:
      - swipe:
          start: 50%,20%
          end: 50%,80%
          duration: 250
      - waitForAnimationToEnd:
          timeout: 4000
